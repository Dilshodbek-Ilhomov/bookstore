<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#111c3e" />
      <stop offset="100%" stop-color="#070c1e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#9a7b2c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="300" height="400" rx="16" fill="url(#grid)" />

  <!-- Book Spine / Accent Line left -->
  <rect x="24" y="0" width="3" height="400" fill="url(#goldGrad)" opacity="0.6" />
  <rect x="32" y="0" width="1" height="400" fill="rgba(255,255,255,0.1)" />

  <!-- Decorative Corner Elements -->
  <path d="M 45 40 L 65 40 M 45 40 L 45 60" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 255 40 L 235 40 M 255 40 L 255 60" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 45 360 L 65 360 M 45 360 L 45 340" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 255 360 L 235 360 M 255 360 L 255 340" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Center Emblem -->
  <g transform="translate(150, 180)">
    <circle r="46" fill="rgba(201, 168, 76, 0.05)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle r="36" fill="rgba(201, 168, 76, 0.1)" stroke="url(#goldGrad)" stroke-width="1" />
    <!-- Phosphor BookOpen icon path -->
    <path d="M-18 -8 C-18 -12 -10 -15 0 -15 C10 -15 18 -12 18 -8 L18 14 C18 10 10 7 0 7 C-10 7 -18 10 -18 14 Z M0 -15 L0 7" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle text -->
  <text x="150" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">BOOKSTORE</text>
  <text x="150" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">PREMIUM EDITION</text>

  <!-- Bottom Gold Bar -->
  <rect x="120" y="330" width="60" height="3" rx="1.5" fill="url(#goldGrad)" opacity="0.7" />
</svg>
